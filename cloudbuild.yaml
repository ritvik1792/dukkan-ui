# dukkan-build SA needs roles/run.admin and roles/iam.serviceAccountUser
# on PROJECT_NUMBER-compute@developer.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - -t
      - ${_IMAGE}
      - .
  # Push before deploy. `gcloud run deploy --image=...:latest` resolves the
  # tag from Artifact Registry, not the image just built on this VM. The
  # implicit `images:` push runs after all steps, so deploy-first ships the
  # previous :latest digest (exactly what happened for dukkan-ui-00002).
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - gcloud
      - run
      - deploy
      - dukkan-ui
      - --image=${_IMAGE}
      - --region=asia-south1
      - --platform=managed
      - --quiet
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/PROJECT_ID/dukkan/dukkan-ui:latest
  _API_URL: https://dukkan-api-HASH.a.run.app
